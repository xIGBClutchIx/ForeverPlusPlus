name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax (Lua 5.1)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file" || status=1
          done < <(find ForeverPlusPlus -name '*.lua' -print0)
          exit $status

      - name: Offline tests (Lib logic)
        run: lua5.1 tests/run.lua

      - name: ASCII only in .lua and .toc
        run: |
          if grep -rnP '[^\x00-\x7F]' --include='*.lua' --include='*.toc' ForeverPlusPlus; then
            echo "Non-ASCII characters found (see above)."
            exit 1
          fi

      - name: Every file in the TOC exists, and every .lua file is in the TOC
        run: |
          status=0
          toc=ForeverPlusPlus/ForeverPlusPlus.toc
          listed=$(grep -v '^#' "$toc" | tr -d '\r' | tr '\\\\' '/' | sed 's/ *\[.*$//' | grep -v '^$')
          for file in $listed; do
            [ -f "ForeverPlusPlus/$file" ] || { echo "In the TOC but missing: $file"; status=1; }
          done
          while IFS= read -r file; do
            rel=${file#ForeverPlusPlus/}
            echo "$listed" | grep -qxF "$rel" || { echo "Not in the TOC: $rel"; status=1; }
          done < <(find ForeverPlusPlus -name '*.lua')
          exit $status

  # The addon folder, ready to drop into Interface\AddOns. Every run uploads it as an artifact
  # (the download is a zip holding ForeverPlusPlus/); a pushed v* tag also attaches the zip to a
  # GitHub release.
  package:
    needs: lua
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # All tags, so a release can link the compare view from the previous one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name the build
        id: name
        run: |
          version=$(grep -m1 '^## Version:' ForeverPlusPlus/ForeverPlusPlus.toc | sed 's/^## Version: *//' | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="ForeverPlusPlus-$GITHUB_REF_NAME"
          else
            name="ForeverPlusPlus-$version-${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Zip the addon folder
        run: |
          mkdir -p dist
          zip -rq "dist/${{ steps.name.outputs.name }}.zip" ForeverPlusPlus
          mkdir -p package
          cp -r ForeverPlusPlus package/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: package/

      - name: Release on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are this version's section of CHANGELOG.md, plus a compare link.
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## /{f=($2==v);next} f' CHANGELOG.md | sed '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "No $version section in CHANGELOG.md"; exit 1; }
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -1)
          if [ -n "$prev" ]; then
            printf '\n---\n**Full Changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
          fi
          gh release create "$GITHUB_REF_NAME" "dist/${{ steps.name.outputs.name }}.zip" --title "$version" --notes-file notes.md

      # Same zip and the same CHANGELOG.md section as the GitHub release (without the compare link).
      # Needs the CF_API_KEY secret and the CF_PROJECT_ID and CF_GAME_VERSION_IDS variables (comma
      # separated CurseForge game version ids); with any missing it says so and the job fails after
      # the GitHub release is already out.
      - name: Upload to CurseForge on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION_IDS: ${{ vars.CF_GAME_VERSION_IDS }}
        run: |
          missing=0
          [ -n "$CF_API_KEY" ] || { echo "Secret CF_API_KEY is not set."; missing=1; }
          [ -n "$CF_PROJECT_ID" ] || { echo "Variable CF_PROJECT_ID is not set."; missing=1; }
          if [ -z "$CF_GAME_VERSION_IDS" ]; then
            echo "Variable CF_GAME_VERSION_IDS is not set. Game versions CurseForge offers:"
            [ -n "$CF_API_KEY" ] && curl -fsS -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions | jq -r '.[] | "\(.id)\t\(.name)"'
            missing=1
          fi
          [ "$missing" = 0 ] || exit 1
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## /{f=($2==v);next} f' CHANGELOG.md | sed '/./,$!d' > cf-notes.md
          metadata=$(jq -n \
            --rawfile changelog cf-notes.md \
            --arg name "$version" \
            --arg ids "$CF_GAME_VERSION_IDS" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name, releaseType: "release", gameVersions: ($ids | split(",") | map(gsub(" "; "") | tonumber))}')
          curl -fsS -X POST "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file" \
            -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=$metadata" \
            -F "file=@dist/${{ steps.name.outputs.name }}.zip"
