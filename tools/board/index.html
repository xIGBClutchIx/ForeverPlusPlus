<title>Forever++ Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one working surface, dark by choice (the project's own navy and gold). A sticky bar of
   four views: Work (every request and report, by where it stands), Next release (what shipping
   now would hold, and the steps to ship it), Releases (each release, or a range of them), and
   Comments (the conversations work comes from, with the work each led to). Work is four columns
   that become one column with a picker on a phone. An item opens as a side sheet (full screen on
   a phone) telling its story: the conversation, where it stands, the next step, and what was
   built, as one diff of all its commits with each commit a click away. Everything that has a
   page elsewhere is a link to it. */
:root {
    --bg: #04060b; --surface: #0a0e18; --surface-2: #121826; --line: #1e273b;
    --ink: #e6eaf4; --ink-2: #a6b0c6; --ink-3: #8690a9;
    --accent: #78a4ff; --accent-ink: #04060b; --accent-soft: #13224a;
    --gold: #e6ba52; --gold-line: #8b6b1b;
    --tint-blue: #111f44; --tint-red: #371616; --tint-gold: #2e250b; --tint-green: #0d2a1b; --tint-gray: #171e2f; --tint-orange: #33200d;
    --dot-open: #8690a9; --dot-progress: #78a4ff; --dot-local: #f0a868; --dot-ready: #e6ba52; --dot-shipped: #4fc88a; --dot-bug: #f27f71;
    --add-bg: #0b2416; --add-ln: #113420; --del-bg: #2d1311; --del-ln: #421c18; --hunk-bg: #101a33;
    --syn-kw: #c792ea; --syn-str: #8fd69a; --syn-num: #f0a868; --syn-com: #6f7c98; --syn-fn: #82aaff; --syn-lit: #ff8fb5;
    --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    --radius: 8px;
    color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body); margin: 0; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.fb * { box-sizing: border-box; }
.fb button, .fb select, .fb input { font: inherit; color: inherit; }
.fb button { cursor: pointer; }
.fb a { color: var(--accent); text-decoration: none; }
.fb a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.fb :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }

/* Top: name, where the project stands, the views */
.top { padding-block: 20px 12px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
.top h1 { font: 700 26px/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; }
.top h1 span { color: var(--gold); }
.standing { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 13.5px; }
.standing b { color: var(--ink); font-weight: 600; }
.places { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; margin-left: auto; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 12px 10px; min-height: 44px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab .count { margin-left: 6px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
main.wrap { padding-block: 18px 64px; display: flex; flex-direction: column; gap: 18px; }
h2 { font: 600 19px/1.25 var(--font-display); margin: 0; text-wrap: balance; }
h3 { font: 600 12px/1.3 var(--font-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin: 0; }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls > * { min-width: 0; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; min-height: 40px; }
input.field { flex: 1 1 200px; }
select.field { max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 12px; font-weight: 500; min-height: 40px; }
.btn:hover, .chip:hover, .field:hover { border-color: var(--ink-3); }
.fb .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-align: left; }
.fb .linkbtn.small { font-size: 13px; }
.fb .linkbtn:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; max-width: 100%; }
.seg button { background: var(--surface); border: 0; padding: 6px 12px; min-height: 38px; font-size: 13.5px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }

/* Tags: a faint tint with normal text; the dot carries the meaning */
.tag, .fb a.tag { display: inline-flex; align-items: center; gap: 5px; background: var(--tint-gray); color: var(--ink); border-radius: 5px; padding: 1px 7px; font-size: 12px; line-height: 1.6; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, transparent); flex: none; }
.tag.plain::before { display: none; }
.tag.bug, .tag.fix { background: var(--tint-red); --dot: var(--dot-bug); }
.tag.request, .tag.feat, .tag.progress { background: var(--tint-blue); --dot: var(--dot-progress); }
.tag.version, .tag.done { background: var(--tint-green); --dot: var(--dot-shipped); }
.tag.ready { background: var(--tint-gold); --dot: var(--dot-ready); }
.tag.local { background: var(--tint-orange); --dot: var(--dot-local); }
.tag.open { --dot: var(--dot-open); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.figures { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--ink-2); font-size: 14px; align-items: baseline; }
.figures b { font: 600 17px/1 var(--font-display); color: var(--ink); margin-right: 5px; font-variant-numeric: tabular-nums; }
.plus, .figures b.plus { color: var(--dot-shipped); } .minus, .figures b.minus { color: var(--dot-bug); }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 12px; color: var(--ink-3); font-size: 13.5px; }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: var(--radius); background: var(--surface); padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.callout b { font-weight: 600; }
.callout.calm { border-left-color: var(--dot-shipped); }

/* Work: what to do next, then the columns. A column's head says how much is in it; on a phone the
   heads give way to a row of four buttons that pick the one column shown. */
.todo { gap: 8px; }
.todo ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.todo li { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 0 10px; align-items: baseline; overflow-wrap: anywhere; }
.todo li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); transform: translateY(-1px); }
[data-stage="open"] { --dot: var(--dot-open); } [data-stage="progress"] { --dot: var(--dot-progress); }
[data-stage="local"] { --dot: var(--dot-local); } [data-stage="pushed"], [data-stage="ready"] { --dot: var(--dot-ready); }
[data-stage="shipped"] { --dot: var(--dot-shipped); }
.picker { display: none; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pick { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--dot); border-radius: var(--radius); padding: 6px 8px 8px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 60px; }
.pick b { font: 600 20px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.pick span { font-size: 12px; font-weight: 600; line-height: 1.25; color: var(--ink-2); }
.pick[aria-pressed="true"] { background: var(--surface-2); border-color: var(--ink-3); border-top-color: var(--dot); }
.pick[aria-pressed="true"] span { color: var(--ink); }
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 0 2px 8px; border-bottom: 2px solid var(--dot); }
.col-head .n { font: 600 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.col-head h2 { font-size: 15px; }
.col-head small { color: var(--ink-3); font-size: 12.5px; margin-left: auto; }
.group { font: 600 12px/1.3 var(--font-mono); padding: 8px 2px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--accent); }
.fb .card a.title { color: var(--ink); font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.card .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-width: 0; }
.card .foot, .line-foot { font-size: 12.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.fb .card .foot a { color: var(--ink-2); }

/* Lists of items (in a release, in the next one, a thread's work) */
.items { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.iline { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 9px 12px; min-width: 0; }
.iline + .iline { border-top: 1px solid var(--line); }
.iline .t { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.iline .t a { color: var(--ink); font-weight: 500; }
.items.tight .iline { padding: 8px 10px; }
.items.tight .iline .t { flex-basis: 150px; font-size: 14px; line-height: 1.35; }
/* The steps to ship: done ones are ticked and quiet, the first one left stands out. */
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; font-size: 14px; }
.steps li::before { counter-increment: step; content: counter(step); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink-2); font-size: 12px; font-weight: 600; }
.steps li > div > b { font-weight: 500; }
.steps li.done::before { content: "\2713"; border-color: var(--dot-shipped); background: var(--tint-green); color: var(--ink); }
.steps li.done > div > b { color: var(--ink-3); font-weight: 400; }
.steps li.now::before { border-color: var(--gold); background: var(--gold); color: var(--accent-ink); }
.steps li.now > div > b { font-weight: 600; }
.steps li > div { min-width: 0; overflow-wrap: anywhere; }
.steps li .muted { display: block; font-size: 13px; }
.steps code { font: 0.92em var(--font-mono); background: var(--surface-2); color: var(--ink); padding: 2px 6px; border-radius: 4px; user-select: all; }

/* Release notes */
.notes { display: flex; flex-direction: column; gap: 12px; }
.notes ul { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.notes li { font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
.notes li b { font-weight: 600; color: var(--gold); }
.notes code, .prose code { font: 0.88em var(--font-mono); background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }

/* Commits */
.commits { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.commit + .commit, .day { border-top: 1px solid var(--line); }
.day { padding: 6px 12px; background: var(--surface-2); font-size: 12px; color: var(--ink-2); font-weight: 600; }
.day:first-child { border-top: 0; }
.commit-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; padding-right: 12px; }
.commit-row:hover { background: var(--surface-2); }
.commit-head { display: flex; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; padding: 10px 0 10px 12px; min-width: 0; min-height: 44px; }
.commit-head .tag { flex: none; } /* the commit's type keeps its whole word beside a long summary */
.what { overflow-wrap: anywhere; line-height: 1.4; min-width: 0; }
.scope { font: 600 0.86em var(--font-mono); margin-right: 6px; color: var(--gold); }
.commit-row .meta { font: 12px var(--font-mono); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.commit-row .extra { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px 8px; padding: 0 0 8px 12px; font-size: 12.5px; align-items: center; }
.commit-body { border-top: 1px solid var(--line); background: var(--bg); padding: 10px; display: flex; flex-direction: column; gap: 8px; }

/* Diffs */
.diffs { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.file { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; min-width: 0; }
.file-top { display: flex; gap: 10px; align-items: baseline; background: var(--surface-2); padding-right: 10px; }
.file-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; flex: 1 1 auto; min-width: 0; text-align: left; background: none; border: 0; padding: 9px 0 9px 10px; min-height: 40px; }
.file-head .path { font: 12.5px var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
.file-head .dir { color: var(--ink-3); }
.file-top .stat { font: 12px var(--font-mono); white-space: nowrap; }
.file-top a { font-size: 12px; white-space: nowrap; }
.file-note { padding: 8px 10px; font-size: 13px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.piece-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.scroll { overflow-x: auto; }
table.diff { border-collapse: collapse; width: 100%; font: 12.5px/1.5 var(--font-mono); tab-size: 4; }
.diff td { padding: 0 8px; vertical-align: top; height: 19px; }
.diff td.ln { width: 1%; min-width: 38px; text-align: right; color: var(--ink-3); user-select: none; padding: 0 6px; font-variant-numeric: tabular-nums; }
.diff td.code { white-space: pre; }
.fb.wraplines .diff td.code { white-space: pre-wrap; overflow-wrap: anywhere; }
.diff tr.add td.code { background: var(--add-bg); } .diff tr.add td.ln { background: var(--add-ln); }
.diff tr.del td.code { background: var(--del-bg); } .diff tr.del td.ln { background: var(--del-ln); }
.diff tr.hunk td { background: var(--hunk-bg); color: var(--ink-2); padding-block: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff tr.more td { padding: 8px; text-align: center; }
.hljs-keyword, .hljs-selector-tag, .hljs-section { color: var(--syn-kw); }
.hljs-string, .hljs-regexp, .hljs-addition { color: var(--syn-str); }
.hljs-number, .hljs-bullet { color: var(--syn-num); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--syn-com); font-style: italic; }
.hljs-title, .hljs-built_in, .hljs-attr, .hljs-name { color: var(--syn-fn); }
.hljs-literal, .hljs-symbol, .hljs-code { color: var(--syn-lit); }
.hljs-strong { font-weight: 600; } .hljs-emphasis { font-style: italic; }

/* Files of a range of releases */
.frows { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 60px 60px; gap: 0 6px; align-items: baseline; padding: 8px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.frow + .frow, .frow + .fhist, .fhist + .frow { border-top: 1px solid var(--line); }
.frow > span { text-align: right; white-space: nowrap; font-family: var(--font-mono); font-size: 12px; }
.frow.head { color: var(--ink-3); font-weight: 600; font-size: 12px; background: var(--surface-2); }
.frow.head > span { font-family: var(--font-body); }
.frow .linkbtn { font: 12.5px var(--font-mono); overflow-wrap: anywhere; color: var(--ink); }
.frow .weight { display: block; height: 3px; background: var(--gold-line); border-radius: 2px; margin-top: 3px; }
.fhist { background: var(--bg); padding: 10px; display: flex; flex-direction: column; gap: 12px; }
.hist-item { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hist-line { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 13px; }

/* Releases: the list beside the release */
.rel-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
.rel-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; position: sticky; top: 60px; max-height: calc(100vh - 80px); overflow-y: auto; }
.fb a.rel-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; padding: 8px 12px; color: var(--ink); align-items: baseline; }
.fb a.rel-row:hover { background: var(--surface-2); text-decoration: none; }
.rel-row + .rel-row { border-top: 1px solid var(--line); }
.rel-row b { font: 600 14px var(--font-mono); }
.rel-row small { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.rel-row[aria-current="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--gold); }
.rel-pick { display: none; }

/* Conversations */
.threads { display: flex; flex-direction: column; gap: 10px; }
.thread { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.thread.quiet { border-left: 3px solid var(--dot-ready); }
.who { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-3); }
.fb .who a.name, .who .name { color: var(--ink); font-weight: 600; }
.thread-title { font-weight: 600; overflow-wrap: anywhere; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; max-width: 75ch; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 6); overflow: hidden; }
.posts { display: flex; flex-direction: column; gap: 8px; }
.post { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.post.mine { border-left-color: var(--gold); }
.post.first { border-left-color: var(--ink-3); }
.post .prose { color: var(--ink-2); font-size: 14px; }
.post.first .prose { color: var(--ink); font-size: 15px; }
.work-of { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }

/* An item's sheet */
dialog.sheet { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(920px, 100vw); max-width: 100vw; border: 0; border-left: 1px solid var(--line); padding: 0; background: var(--bg); color: var(--ink); }
dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.6); }
/* While a sheet is open the page under it stays put, and a scroll that reaches the sheet's end stops there. */
html:has(dialog.sheet[open]) { overflow: hidden; }
dialog.sheet { overflow-y: auto; overscroll-behavior: contain; }
.sheet-in { display: flex; flex-direction: column; gap: 18px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.fb .sheet-in:focus-visible { outline: none; }
/* Stays at the top while the sheet scrolls, so Close is always in reach. */
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 0 10px; }
.sheet-bar .chips { flex: 1 1 auto; min-width: 0; }
.sheet-in h2 { font-size: 21px; overflow-wrap: anywhere; }
.sheet-in .section { scroll-margin-top: 92px; }
.links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; align-items: baseline; }
.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.step { border: 0 solid var(--line); border-top-width: 3px; padding-top: 6px; font-size: 12.5px; color: var(--ink-3); min-width: 0; overflow-wrap: anywhere; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha512-D9gUyxqja7hBtkWpPWGt9wfbfaMGVt9gnyCvYa+jojwwPHLCzUm5i8rpk7vD7wNee9bA35eYIjobYPaQuKS1MQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(() => {
'use strict';

const UNRELEASED = 'Unreleased', WIP = 'In progress';
const VIEWS = ['work', 'ship', 'releases', 'comments'];
// Old links keep working.
const ALIAS = { board: 'work', changes: 'releases', compare: 'releases', feedback: 'comments', 'release-unreleased': 'ship' };
// Where a piece of work stands, in the order it moves. `short` is the name on a phone's picker.
const COLS = [
    { id: 'open', name: 'Waiting', hint: 'Nothing made yet' },
    { id: 'progress', name: 'In progress', hint: 'On a branch' },
    { id: 'ready', name: 'Next release', short: 'Unreleased', hint: 'On main, not tagged' },
    { id: 'shipped', name: 'Released', hint: 'In a release' },
];
const COL_OF = { open: 'open', progress: 'progress', local: 'ready', pushed: 'ready', shipped: 'shipped' };
const KIND = { bug: 'Bug', request: 'Request', issue: 'Issue', pull: 'Pull request' };
const app = document.getElementById('app');
const view = document.getElementById('view');
const sheet = document.getElementById('sheet');
const sheetIn = document.getElementById('sheet-in');

const D = { files: new Map() };
const S = {
    view: 'work', boardQuery: '', boardSource: 'all', boardKind: 'all', boardCol: null, shippedAll: false,
    release: null, compareFrom: '', comparePane: 'files', pane: 'together', itemPane: 'together', types: new Set(), scope: '', commitQuery: '',
    threadFilter: null, threadSource: 'all', threadQuery: '',
};

// When this viewer last opened the board, to mark what moved since. Only a convenience.
let lastVisit = null;
try {
    lastVisit = localStorage.getItem('fpp-board-visit');
    localStorage.setItem('fpp-board-visit', new Date().toISOString());
} catch { /* no storage here */ }

// Building blocks ------------------------------------------------------------------------------

function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
        if (v == null || v === false) { continue; }
        if (k === 'class') { n.className = v; }
        else if (k === 'text') { n.textContent = v; }
        else if (k.startsWith('on')) { n.addEventListener(k.slice(2), v); }
        else if (k === 'href') {
            if (/^https:\/\//.test(v)) { n.href = v; n.target = '_blank'; n.rel = 'noopener'; }
            else if (v.startsWith('#')) { n.setAttribute('href', v); }
        }
        else { n.setAttribute(k, v === true ? '' : v); }
    }
    for (const kid of kids.flat(Infinity)) {
        if (kid == null || kid === false) { continue; }
        n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return n;
}
const tag = (text, cls) => el('span', { class: 'tag ' + (cls || 'plain'), text });
// A link when there is somewhere to go, plain text when there isn't.
const link = (href, text, cls) => (href ? el('a', { href, text, class: cls }) : el('span', { text, class: cls }));
const stop = (e) => e.stopPropagation();

const ET = 'America/New_York';
const dayFmt = new Intl.DateTimeFormat('en-US', { timeZone: ET, month: 'short', day: 'numeric' });
const dayYearFmt = new Intl.DateTimeFormat('en-US', { timeZone: ET, month: 'short', day: 'numeric', year: 'numeric' });
const timeFmt = new Intl.DateTimeFormat('en-US', { timeZone: ET, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const day = (iso) => (iso ? dayFmt.format(new Date(iso)) : '');
const dayYear = (iso) => (iso ? dayYearFmt.format(new Date(iso)) : '');
// A release's date is a calendar day, not a moment: keep it from sliding a day in another zone.
const calendarDay = (ymd) => (ymd ? dayYearFmt.format(new Date(ymd + 'T12:00:00-05:00')) : '');
const dayStart = (ymd) => new Date(ymd + 'T00:00:00-05:00').toISOString();
const count = (n, one, many) => n.toLocaleString('en-US') + ' ' + (n === 1 ? one : many || one + 's');
const short = (sha) => sha.slice(0, 8);
const slug = (version) => version.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const isNew = (iso) => !!(lastVisit && iso && iso > lastVisit);

// Where things live outside the board.
const repoUrl = () => D.board.repo.url || '';
const pushed = (c) => !!(repoUrl() && c && !c.local && c.release !== WIP);
const commitUrl = (c) => (pushed(c) ? repoUrl() + '/commit/' + c.sha : null);
const blobUrl = (ref, p) => repoUrl() + '/blob/' + ref + '/' + p.split('/').map(encodeURIComponent).join('/');
const releaseUrl = (r) => (repoUrl() && r.tag ? repoUrl() + '/releases/tag/' + encodeURIComponent(r.tag) : null);
const authorUrl = (source, name) => (!name ? null : source === 'github' ? 'https://github.com/' + encodeURIComponent(name)
    : 'https://www.curseforge.com/members/' + encodeURIComponent(name));
const releaseHash = (version) => (version === UNRELEASED ? '#ship' : '#release-' + slug(version));
function versionTag(version) {
    if (!D.releaseByVersion.has(version)) { return tag(version, 'version'); }
    return el('a', { class: 'tag version', href: releaseHash(version), text: version, onclick: stop });
}

// Text with `code`, **bold**, links, #12 as a link to that request, and a "## heading" line (an
// issue form's questions) in bold without its marks.
function inline(text, into) {
    const re = /`([^`\n]+)`|\*\*([^*\n]+)\*\*|\[([^\]\n]+)\]\((https:\/\/[^)\s]+)\)|(https:\/\/[^\s<>)\]"']+)|#(\d+)\b|^#{1,6} +([^\n]+)$/gm;
    let at = 0, m;
    while ((m = re.exec(text))) {
        if (m.index > at) { into.append(text.slice(at, m.index)); }
        if (m[1] != null) { into.append(el('code', { text: m[1] })); }
        else if (m[2] != null) { into.append(el('strong', { text: m[2] })); }
        else if (m[3] != null) { into.append(el('a', { href: m[4], text: m[3].replace(/`/g, '') })); }
        else if (m[5] != null) { into.append(el('a', { href: m[5], text: m[5] })); }
        else if (m[7] != null) { into.append(el('strong', { text: m[7] })); }
        else if (D.itemById.has('gh-' + m[6])) { into.append(el('a', { href: '#item-gh-' + m[6], text: '#' + m[6] })); }
        else if (repoUrl()) { into.append(el('a', { href: repoUrl() + '/issues/' + m[6], text: '#' + m[6] })); }
        else { into.append(m[0]); }
        at = re.lastIndex;
    }
    if (at < text.length) { into.append(text.slice(at)); }
    return into;
}

// A long text cut to a few lines, with a button to show the rest.
function clamped(text, lines) {
    const box = inline(text, el('div', { class: 'prose clamp', style: '--lines:' + lines }));
    const wrap = el('div', { class: 'section' }, box);
    if (text.split('\n').length > lines || text.length > lines * 90) {
        const more = el('button', { class: 'linkbtn small', text: 'Show all of it', onclick: (e) => {
            stop(e);
            const open = box.classList.toggle('clamp');
            more.textContent = open ? 'Show all of it' : 'Show less';
        } });
        wrap.append(more);
    }
    return wrap;
}

function segmented(options, current, onPick, label) {
    const box = el('div', { class: 'seg', role: 'group', 'aria-label': label || 'Show' });
    for (const [id, text] of options) {
        const btn = el('button', { 'aria-pressed': id === current ? 'true' : 'false', text, onclick: () => {
            for (const b of box.children) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); }
            onPick(id);
        } });
        box.append(btn);
    }
    return box;
}

function wrapToggle() {
    const on = () => app.classList.contains('wraplines');
    const b = el('button', { class: 'chip', 'aria-pressed': on() ? 'true' : 'false', text: 'Wrap long lines',
        onclick: () => { app.classList.toggle('wraplines'); b.setAttribute('aria-pressed', on() ? 'true' : 'false'); } });
    return b;
}

function figures(parts) {
    return el('div', { class: 'figures' }, parts.filter(Boolean).map((p) => (p.nodeType ? p
        : el('span', null, el('b', { class: p.cls, text: p.n }), p.label))));
}
const numbers = (files, adds, dels, extra) => figures([
    ...(extra || []),
    { n: files.toLocaleString('en-US'), label: files === 1 ? 'file' : 'files' },
    { n: '+' + adds.toLocaleString('en-US'), label: 'added', cls: 'plus' },
    { n: '-' + dels.toLocaleString('en-US'), label: 'removed', cls: 'minus' },
]);

// Data files, each fetched once.
function load(name) {
    if (!D.files.has(name)) {
        D.files.set(name, fetch('data/' + name).then((r) => {
            if (!r.ok) { throw new Error('missing'); }
            return r.json();
        }).catch((err) => { D.files.delete(name); throw err; }));
    }
    return D.files.get(name);
}
const fileOf = (version) => (version === UNRELEASED ? 'unreleased' : version);
const loadPatches = (version) => load('patch-' + fileOf(version) + '.json');
const loadDiff = (version) => load('diff-' + fileOf(version) + '.json');
const loadWork = (id) => load('work-' + id + '.json');
// Something that loads: shows a line while it does, then what `draw` makes of it.
function later(promise, draw, what) {
    const box = el('div', { class: 'section' }, el('div', { class: 'file-note', text: 'Loading ' + what }));
    promise.then((data) => box.replaceChildren(...[].concat(draw(data)).filter(Boolean))).catch(() => {
        box.replaceChildren(el('div', { class: 'file-note', text: 'The ' + what + ' could not be loaded. Switch views and back to try again.' }));
    });
    return box;
}

// Work ---------------------------------------------------------------------------------------

const stageOf = (i) => (i.status === 'ready' ? (i.pushed ? 'pushed' : 'local') : i.status);
const convoOf = (i) => (i.thread ? D.convoById.get(i.thread) : null);
const sourceTag = (item) => el('a', { class: 'tag plain', href: item.url, text: item.source === 'github' ? 'GitHub #' + item.number : 'CurseForge', onclick: stop });
const kindTag = (item) => tag(KIND[item.kind] || item.kind, item.kind === 'bug' ? 'bug' : item.kind === 'request' ? 'request' : 'plain');
function stageTag(item) {
    switch (stageOf(item)) {
        case 'open': return tag('waiting', 'open');
        case 'progress': return tag(item.branch || 'in progress', 'progress');
        case 'local': return el('a', { class: 'tag local', href: '#ship', text: 'on main, not pushed', onclick: stop });
        case 'pushed': return el('a', { class: 'tag ready', href: '#ship', text: 'in the next release', onclick: stop });
        case 'shipped': return item.version ? versionTag(item.version) : tag('done', 'done');
        default: return tag('closed without a change', 'open');
    }
}
const workLine = (item) => (item.work ? [count(item.commits.length, 'commit') + ', ',
    el('span', { class: 'plus', text: '+' + item.work.adds }), ' ', el('span', { class: 'minus', text: '-' + item.work.dels })] : null);

// Whether the person who asked heard back after it shipped. A closed GitHub issue told them;
// on CurseForge only a reply of ours dated after the release counts (the feed shows only some).
function owed(item) {
    const convo = convoOf(item);
    if (item.status !== 'shipped' || !convo || convo.mine) { return false; }
    if (convo.source === 'github') { return convo.state === 'open'; }
    const rel = D.releaseByVersion.get(item.version);
    if (!rel || !rel.date) { return false; }
    const since = dayStart(rel.date);
    return !convo.posts.some((p) => p.mine && p.date >= since);
}

// The one thing that moves it on, as words with links.
function nextStep(item) {
    const convo = convoOf(item);
    const who = item.author || 'them';
    const where = item.source === 'github' ? 'GitHub' : 'CurseForge';
    switch (stageOf(item)) {
        case 'open':
            if (convo && !convo.mine && !convo.replied) { return ['Reply to ' + who + ' on ' + where + ', or start on it. ', el('span', { class: 'muted', text: 'No reply of yours seen yet.' })]; }
            return [item.note ? 'Where it stands: ' + item.note + '.' : 'Start on it, or close it with a reply.'];
        case 'progress': return ['Review ', el('code', { text: item.branch || 'its branch' }), ' and merge it into main.'];
        case 'local': return [el('a', { href: '#ship', text: 'Push main' }), ', then it goes out with the next release. Tell ' + who + ' on ' + where + ' once it does.'];
        case 'pushed': return [el('a', { href: '#ship', text: 'Release it' }), ': it is pushed and waiting for the next tag. Tell ' + who + ' on ' + where + ' once it is out.'];
        case 'shipped':
            if (owed(item)) {
                return convo.source === 'github' ? ['It shipped in ' + item.version + ' but the issue is still open: close it with a reply.']
                    : ['Tell ' + who + ' it is out in ' + item.version + '. ', el('span', { class: 'muted', text: 'No reply of yours seen since it shipped (CurseForge\'s feed shows only some replies).' })];
            }
            return null;
        default: return null;
    }
}

// What a card or line adds to its column's own name: the branch, and what is owed to the person
// who asked.
function flags(item) {
    const convo = convoOf(item);
    const stage = stageOf(item);
    return [
        stage === 'progress' && tag(item.branch || 'on a branch', 'progress'),
        stage === 'open' && convo && !convo.mine && !convo.replied && tag('no reply seen', 'ready'),
        stage === 'declined' && stageTag(item),
        owed(item) && tag('owed a reply', 'local'),
        isNew(item.updated) && tag('new', 'ready'),
    ];
}

function card(item) {
    const convo = convoOf(item);
    const siblings = convo ? convo.items.length : 0;
    return el('article', { class: 'card', onclick: (e) => { if (!e.target.closest('a')) { location.hash = 'item-' + item.id; } } },
        el('div', { class: 'row' }, sourceTag(item), kindTag(item), flags(item)),
        el('a', { class: 'title', href: '#item-' + item.id, text: item.title }),
        el('div', { class: 'foot' }, link(authorUrl(item.source, item.author), item.author, null), el('span', { text: day(item.opened) }),
            item.work ? el('span', null, workLine(item)) : null,
            convo && convo.posts.length ? el('span', { text: count(convo.posts.length, 'reply', 'replies') }) : null,
            siblings > 1 ? el('span', { text: '1 of ' + siblings + ' from one ' + (convo.source === 'github' ? 'issue' : 'comment') }) : null));
}

function filteredItems() {
    const q = S.boardQuery.trim().toLowerCase();
    return D.board.items.filter((i) => (S.boardSource === 'all' || i.source === S.boardSource)
        && (S.boardKind === 'all' || i.kind === S.boardKind)
        && (!q || (i.title + ' ' + i.author + ' ' + (i.number || '') + ' ' + (i.branch || '') + ' ' + ((convoOf(i) || {}).text || '')).toLowerCase().includes(q)));
}

// What to do next with the project as a whole, most pressing first: people waiting on a word,
// work waiting on a review, then what is left to push, release, and tell.
function projectStep() {
    const b = D.board;
    const progress = b.items.filter((i) => i.status === 'progress');
    const look = D.comments.filter(needsLook);
    const owedList = b.items.filter(owed);
    const rows = [];
    const row = (stage, lead, ...rest) => rows.push(el('li', { 'data-stage': stage }, el('div', null, el('b', { text: lead }), ' ', rest)));
    const names = (list, text) => list.map((i, n) => [n ? ', ' : '', el('a', { href: '#item-' + i.id, text: text(i) })]);
    if (look.length) {
        row('open', count(look.length, 'conversation') + ' with no reply and no work.',
            el('a', { href: '#comments', text: look.length === 1 ? 'Read it' : 'Read them', onclick: () => { S.threadFilter = 'look'; } }));
    }
    if (progress.length) { row('progress', count(progress.length, 'branch', 'branches') + ' to review and merge:', names(progress, (i) => i.branch || i.title)); }
    if (b.unpushed) { row('local', count(b.unpushed, 'commit') + ' on main not pushed.', 'Push main, then release. ', el('a', { href: '#ship', text: 'Steps to ship' })); }
    else if (b.unreleased) { row('ready', count(b.unreleased, 'commit') + ' since ' + b.latest + ', all pushed.', 'Ready to tag. ', el('a', { href: '#ship', text: 'Steps to ship' })); }
    if (owedList.length) { row('shipped', count(owedList.length, 'released request') + ' with no word back to:', names(owedList, (i) => i.author || i.title)); }
    if (!rows.length) { return el('div', { class: 'callout calm' }, el('div', { text: 'Nothing to do: everything made is released, and everyone heard back.' })); }
    return el('div', { class: 'callout todo' }, el('h3', { text: 'What to do next' }), el('ul', null, rows));
}

function renderWork() {
    const items = filteredItems();
    const by = (stage) => items.filter((i) => stageOf(i) === stage);
    const inCol = (id) => items.filter((i) => COL_OF[stageOf(i)] === id);
    if (!S.boardCol) { S.boardCol = (COLS.find((c) => c.id !== 'shipped' && inCol(c.id).length) || COLS[3]).id; }

    const cols = el('div', { class: 'cols', 'data-show': S.boardCol });
    const picker = el('div', { class: 'picker', role: 'group', 'aria-label': 'Which stage to show' });
    for (const c of COLS) {
        const list = inCol(c.id);
        picker.append(el('button', { class: 'pick', 'data-stage': c.id, 'aria-pressed': S.boardCol === c.id ? 'true' : 'false',
            onclick: (e) => {
                S.boardCol = c.id; cols.dataset.show = c.id;
                for (const t of picker.children) { t.setAttribute('aria-pressed', t === e.currentTarget ? 'true' : 'false'); }
            } }, el('b', { text: list.length }), el('span', { text: c.short || c.name })));
        const col = el('section', { class: 'col', 'data-col': c.id, 'data-stage': c.id },
            el('div', { class: 'col-head' }, el('span', { class: 'n', text: list.length }), el('h2', { text: c.name }),
                c.id === 'ready' && D.board.unreleased ? el('small', null, el('a', { href: '#ship', text: 'Steps to ship' })) : el('small', { text: c.hint })));
        if (!list.length) {
            col.append(el('div', { class: 'empty', text: {
                open: 'Nothing waiting.', progress: 'Nothing on a branch right now.',
                ready: 'Nothing merged since ' + (D.board.latest || 'the last release') + '.', shipped: 'Nothing released matches.',
            }[c.id] }));
        } else if (c.id === 'ready') {
            for (const [stage, title] of [['local', 'On main, not pushed'], ['pushed', 'Pushed, not released']]) {
                const part = list.filter((i) => stageOf(i) === stage);
                if (!part.length) { continue; }
                col.append(el('div', { class: 'group' }, tag(title, stage === 'local' ? 'local' : 'ready')), ...part.map(card));
            }
        } else if (c.id === 'shipped') {

// Diffs ----------------------------------------------------------------------------------------

const LANG = { lua: 'lua', md: 'markdown', yml: 'yaml', yaml: 'yaml', json: 'json', toc: 'ini', xml: 'xml', mjs: 'javascript', js: 'javascript', html: 'xml', editorconfig: 'ini' };
function highlight(code, lang) {
    const h = window.hljs;

    try { return h.highlight(code, { language: lang, ignoreIllegals: true }).value; } catch { return null; }
}

function diffTable(patch, filePath) {
    const lang = LANG[(filePath.split('.').pop() || '').toLowerCase()];
    const table = el('table', { class: 'diff' });
    const rows = patch.split('\n');
    let o = 0, n = 0, i = 0;
    function draw(until) {
        for (; i < rows.length && i < until; i++) {
            const line = rows[i];
            const c = line[0];
            if (c === '@') {
                const m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
                if (m) { o = Number(m[1]); n = Number(m[2]); }
                table.append(el('tr', { class: 'hunk' }, el('td', { colspan: 3, text: line })));
                continue;
            }
            if (c === '\\') { continue; }
            const code = el('td', { class: 'code' });
            const text = line.slice(1);
            // highlight.js escapes the code it's given, so its HTML holds no markup from the diff.
            const html = highlight(text, lang);
            if (html != null) { code.innerHTML = html; } else { code.textContent = text; }
            table.append(el('tr', { class: c === '+' ? 'add' : c === '-' ? 'del' : '' },
                el('td', { class: 'ln old', text: c === '+' ? '' : o }),
                el('td', { class: 'ln', text: c === '-' ? '' : n }), code));
            if (c !== '+') { o++; }
            if (c !== '-') { n++; }
        }
        if (i < rows.length) {
            const row = el('tr', { class: 'more' });
            row.append(el('td', { colspan: 3 }, el('button', {
                class: 'linkbtn', text: 'Show ' + count(rows.length - i, 'more line'),
                onclick: () => { row.remove(); draw(Infinity); },
            })));
            table.append(row);
        }
    }
    draw(500);
    return el('div', { class: 'scroll' }, table);
}

            el('span', { class: 'name', text: file.path.slice(cut + 1) })),

// Many files' diffs: closed past a few, with a button to open them all, and the rest of a long

function fileList(files, ctx) {

        url: (f) => (base && reachable && f.status !== 'deleted' ? blobUrl(r.tag || D.board.head.sha, f.path) : null),

    };
    const draw = () => {

    draw();
    return el('div', { class: 'section' },
        el('h3', { text: 'The changes' }),
        el('div', { class: 'controls' }, segmented([['together', 'All together, ' + count(net.files, 'file')], ['commits', 'Commit by commit, ' + r.commits]], S.pane, (id) => { S.pane = id; draw(); }), wrapToggle()),
        content);
}

// Next release ---------------------------------------------------------------------------------

function renderShip() {
    const b = D.board;
    const r = D.releaseByVersion.get(UNRELEASED);
    const items = b.items.filter((i) => i.status === 'ready');
    const progress = b.items.filter((i) => i.status === 'progress');
    const owedList = b.items.filter(owed);
    const net = r.net || { files: 0, adds: 0, dels: 0 };
    const tocBumped = b.next.toc && b.next.toc !== b.latest;
    const hasNotes = b.next.notes > 0;

    // The steps, in the order AGENTS.md's Releases section gives them. Once the TOC has the new
    // version, the tag's command names it.
    const v = tocBumped ? 'v' + b.next.toc : 'vX.Y.Z';
    const steps = [
        { done: !progress.length, what: progress.length ? 'Merge or leave out the work on branches' : 'No work waiting on a branch',
            more: progress.length ? progress.map((i, n) => [n ? ', ' : '', el('a', { href: '#item-' + i.id, text: i.branch || i.title })]) : null },
        { done: !b.unpushed, what: b.unpushed ? 'Push main: ' + count(b.unpushed, 'commit') + (b.unpushed === 1 ? ' is' : ' are') + ' only here' : b.remote ? 'Main is pushed' : 'No remote to push to',
            more: b.unpushed ? el('code', { text: 'git push origin main' }) : null },
        { done: hasNotes && b.next.gameNotes, what: hasNotes ? 'Release notes written: ' + count(b.next.notes, 'entry', 'entries') + ' in CHANGELOG.md' : 'Write the release notes',
            more: !b.next.gameNotes ? 'ForeverPlusPlus/Changelog.lua has no unreleased entry yet; it needs the same notes.' : hasNotes ? 'The same notes are in Changelog.lua; give both the new version and date.' : 'CHANGELOG.md and Changelog.lua both need them.' },
        { done: tocBumped, what: tocBumped ? 'The TOC says ' + b.next.toc : 'Bump ## Version in the TOC (it still says ' + (b.next.toc || '?') + ')' },
        { done: false, what: 'Tag it and push the tag', more: [el('code', { text: 'git tag ' + v + ' && git push origin ' + v }), el('span', { class: 'muted', text: 'GitHub, CurseForge, and Wago take it from there.' })] },
        { done: !items.length && !owedList.length, what: items.length ? 'Tell ' + count(new Set(items.map((i) => i.author)).size, 'person', 'people') + ' it is out' : owedList.length ? 'Tell those still owed a reply (below)' : 'Nobody waiting to hear about it',
            more: items.length ? items.map((i, n) => [n ? ', ' : '', el('a', { href: '#item-' + i.id, text: i.author || i.title })]) : null },
    ];
    const now = steps.findIndex((s) => !s.done);

    const top = el('div', { class: 'panel' },
        el('div', { class: 'controls' }, el('h2', { text: 'Next release' }), el('span', { class: 'muted', text: 'everything on main since ' + (b.latest || 'the start') })),
        r.commits ? numbers(net.files, net.adds, net.dels, [{ n: r.commits, label: r.commits === 1 ? 'commit' : 'commits' },
            b.unpushed ? el('span', null, tag(b.unpushed === r.commits ? 'none pushed' : b.unpushed + ' not pushed', 'local')) : el('span', null, tag('all pushed', 'done'))])
            : el('div', { class: 'muted', text: 'Nothing on main since ' + b.latest + '.' }),
        el('div', { class: 'split' },
            el('div', { class: 'section' }, el('h3', { text: 'To ship it' }),
                el('ol', { class: 'steps' }, steps.map((s, n) => el('li', { class: s.done ? 'done' : n === now ? 'now' : '' },
                    el('div', null, el('b', { text: s.what }), s.more ? el('span', { class: 'muted' }, s.more) : null))))),
            el('div', { class: 'section' },
                el('h3', { text: 'What it answers' }),
                items.length ? itemLines(items) : el('div', { class: 'empty', text: 'No request or report is in it yet.' }),
                el('h3', { text: 'Release notes so far' }),
                notesBlock(r.sections, false, 'No notes under Unreleased in CHANGELOG.md yet.'))));

    view.replaceChildren(top);
    if (owedList.length) {
        view.append(el('div', { class: 'section' }, el('h3', { text: 'Already released, still owed a reply' }),
            itemLines(owedList, (i) => el('span', { class: 'muted small' }, i.version + ', ' + i.author))));
    }
    if (r.commits) { view.append(el('div', { class: 'panel' }, changesBlock(r))); }

    const branches = b.branches || [];
    if (branches.length || progress.length) {
        const known = new Map(b.items.filter((i) => i.branch).map((i) => [i.branch, i]));
        view.append(el('div', { class: 'section' }, el('h3', { text: 'Branches not merged into main' }),
            el('div', { class: 'items' }, branches.map((br) => {
                const item = known.get(br.name);
                return el('div', { class: 'iline' }, tag(br.name, 'progress'),
                    el('span', { class: 't' }, item ? el('a', { href: '#item-' + item.id, text: item.title }) : el('span', { class: 'muted', text: br.subject })),
                    el('span', { class: 'muted small', text: count(br.ahead, 'commit') + ' ahead, ' + day(br.date) }));
            }))));
    }
}

// Releases -------------------------------------------------------------------------------------

function answeredBy(version) {
    return D.board.items.filter((i) => i.status === 'shipped' && i.version === version);
}

function renderReleases() {
    const tagged = D.releases.filter((r) => r.tag);
    if (!tagged.length) { view.replaceChildren(el('div', { class: 'empty', text: 'No release is tagged yet.' })); return; }
    if (!S.release || !D.releaseByVersion.has(S.release) || S.release === UNRELEASED) { S.release = tagged[0].version; }
    const r = D.releaseByVersion.get(S.release);
    const idx = (v) => D.releases.findIndex((x) => x.version === v); // 0 is the newest
    if (S.compareFrom && idx(S.compareFrom) <= idx(r.version)) { S.compareFrom = ''; }
    const pick = (v) => { S.types.clear(); S.scope = ''; S.commitQuery = ''; location.hash = 'release-' + slug(v); };

    const list = el('nav', { class: 'rel-list', 'aria-label': 'Releases' },
        el('a', { class: 'rel-row', href: '#ship' }, el('b', { text: 'Next' }), el('small', { text: count(D.board.unreleased, 'commit') })),
        tagged.map((x) => el('a', { class: 'rel-row', href: '#release-' + slug(x.version), 'aria-current': x.version === r.version ? 'true' : 'false' },
            el('b', { text: x.version }), el('small', { text: calendarDay(x.date) }))));
    const select = el('select', { class: 'field', id: 'release-pick', 'aria-label': 'Release', onchange: (e) => pick(e.target.value) },
        tagged.map((x) => el('option', { value: x.version, selected: x.version === r.version, text: x.version + (x.date ? ', ' + calendarDay(x.date) : '') })));
    const older = D.releases.slice(idx(r.version) + 1).filter((x) => x.tag);
    const compare = older.length ? el('select', { class: 'field', id: 'compare-from', 'aria-label': 'Compare with an older release', onchange: (e) => { S.compareFrom = e.target.value; render(); } },
        el('option', { value: '', text: 'Just this release' }),
        older.slice(1).map((x) => el('option', { value: x.version, selected: S.compareFrom === x.version, text: 'Everything since ' + x.version }))) : null;

    const page = el('div', { class: 'section' }, el('div', { class: 'controls rel-pick' }, select), S.compareFrom ? compareBody(S.compareFrom, r, compare) : releaseBody(r, compare));
    view.replaceChildren(el('div', { class: 'rel-layout' }, list, page));
    const current = list.querySelector('[aria-current="true"]');
    if (current) { requestAnimationFrame(() => { if (list.scrollHeight > list.clientHeight) { current.scrollIntoView({ block: 'nearest' }); } }); }
}

function releaseBody(r, compare) {
    const net = r.net || { files: r.files.length, adds: r.adds, dels: r.dels };
    const answered = answeredBy(r.version);
    return el('div', { class: 'panel' },
        el('div', { class: 'controls' }, el('h2', { text: 'Forever++ ' + r.version }), r.date ? el('span', { class: 'muted', text: calendarDay(r.date) }) : null,
            releaseUrl(r) && el('a', { class: 'small', href: releaseUrl(r), text: 'Release on GitHub' })),
        numbers(net.files, net.adds, net.dels, [{ n: r.commits, label: r.commits === 1 ? 'commit' : 'commits' }]),
        compare ? el('div', { class: 'controls' }, compare) : null,
        el('div', { class: 'split' },
            el('div', { class: 'section' }, el('h3', { text: 'Release notes' }), notesBlock(r.sections)),
            el('div', { class: 'section' }, el('h3', { text: 'Requests and reports it answered' }),
                answered.length ? itemLines(answered) : el('div', { class: 'muted', text: 'None linked.' }))),
        changesBlock(r));
}

// Several releases at once: their notes, the files their commits touched, and the commits.
function compareBody(fromVersion, toRel, compare) {
    const idx = (v) => D.releases.findIndex((x) => x.version === v);
    const range = D.releases.slice(idx(toRel.version), idx(fromVersion)); // newer first, "from" left out
    const inRange = new Set(range.map((x) => x.version));
    const commits = D.commits.filter((c) => inRange.has(c.release));
    const files = new Map();
    for (const x of range) {
        for (const [p, a, d, n] of x.files) {
            const t = files.get(p) || [p, 0, 0, 0];
            t[1] += a; t[2] += d; t[3] += n;
            files.set(p, t);
        }
    }
    const list = [...files.values()].sort((a, b) => b[1] + b[2] - a[1] - a[2]);
    const headings = [];
    for (const x of range) {
        for (const s of x.sections) {
            let h = headings.find((y) => y.heading === s.heading);
            if (!h) { h = { heading: s.heading, entries: [] }; headings.push(h); }
            h.entries.push(...s.entries.map((e) => ({ ...e, version: x.version })));
        }
    }
    const first = ['Added', 'Changed', 'Fixed'];
    headings.sort((a, b) => (first.indexOf(a.heading) + 1 || 9) - (first.indexOf(b.heading) + 1 || 9));
    const answered = D.board.items.filter((i) => i.status === 'shipped' && inRange.has(i.version));
    const base = repoUrl();
    const from = D.releaseByVersion.get(fromVersion);
    const whole = base ? base + '/compare/' + from.tag + '...' + toRel.tag : null;
    const content = el('div', { class: 'section' });
    const draw = () => content.replaceChildren(S.comparePane === 'commits' ? commitList(commits, { filters: true, limit: 80 }) : fileRows(list, range.map((x) => x.version)));
    draw();
    return el('div', { class: 'panel' },
        el('div', { class: 'controls' }, el('h2', { text: fromVersion + ' to ' + toRel.version }), whole && el('a', { class: 'small', href: whole, text: 'The whole diff on GitHub' })),
        figures([{ n: range.length, label: 'releases' }, { n: commits.length.toLocaleString('en-US'), label: 'commits' }, { n: list.length.toLocaleString('en-US'), label: 'files touched' }]),
        el('div', { class: 'controls' }, compare),
        el('div', { class: 'chips small' }, el('span', { class: 'muted', text: 'Releases in it:' }), [...range].reverse().map((x) => versionTag(x.version))),
        el('div', { class: 'split' },
            el('div', { class: 'section' }, el('h3', { text: 'What changed for players' }), notesBlock(headings, true)),
            el('div', { class: 'section' }, el('h3', { text: 'Requests and reports answered' }), answered.length ? itemLines(answered, (i) => versionTag(i.version)) : el('div', { class: 'muted', text: 'None linked.' }))),
        el('div', { class: 'section' }, el('h3', { text: 'The changes' }),
            el('div', { class: 'controls' }, segmented([['files', 'Files, ' + list.length], ['commits', 'Commits, ' + commits.length]], S.comparePane, (id) => { S.comparePane = id; draw(); }), wrapToggle()),
            el('div', { class: 'muted small', text: 'Across several releases, each file opens to every change made to it in order; lines are summed over the commits. GitHub has the net diff.' }),
            content));
}

// The files a set of releases touched. A file opens to every change made to it in them.
function fileRows(list, versions) {
    let cap = 25;
    const box = el('div', { class: 'section' });
    const rows = el('div', { class: 'frows' });
    function draw() {
        const top = list.length ? list[0][1] + list[0][2] : 1;
        rows.replaceChildren(el('div', { class: 'frow head' }, el('div', { text: 'File' }), el('span', { text: 'Commits', title: 'Commits' }), el('span', { text: 'Added' }), el('span', { text: 'Removed' })));
        for (const [p, a, d, n] of list.slice(0, cap)) {
            let hist = null;
            const btn = el('button', { class: 'linkbtn', 'aria-expanded': 'false', text: p, onclick: () => {
                if (hist) { hist.remove(); hist = null; btn.setAttribute('aria-expanded', 'false'); return; }
                hist = fileHistory(p, versions);
                row.after(hist);
                btn.setAttribute('aria-expanded', 'true');
            } });
            const row = el('div', { class: 'frow' },
                el('div', null, btn, el('span', { class: 'weight', style: 'width:' + Math.max(1, Math.round(100 * (a + d) / top)) + '%' })),
                el('span', { text: n }), el('span', { class: 'plus', text: '+' + a }), el('span', { class: 'minus', text: '-' + d }));
            rows.append(row);
        }
        if (!list.length) { rows.append(el('div', { class: 'file-note', text: 'No files changed.' })); }
    }
    draw();
    box.append(rows);
    if (list.length > cap) {
        box.append(el('button', { class: 'btn', text: 'Show all ' + count(list.length, 'file'), onclick: (e) => { cap = Infinity; draw(); e.target.remove(); } }));
    }
    return box;
}

function fileHistory(filePath, versions) {
    const box = el('div', { class: 'fhist' }, el('div', { class: 'file-note', text: versions.length > 3 ? 'Loading this file\'s changes across ' + versions.length + ' releases' : 'Loading this file\'s changes' }));
    Promise.all(versions.map(loadPatches)).then((all) => {
        const found = [];
        for (const p of all) {
            for (const [sha, files] of Object.entries(p.commits)) {
                const c = D.commitBySha.get(sha);
                for (const f of files) { if (c && (f.path === filePath || f.from === filePath)) { found.push([c, f]); } }
            }
        }
        found.sort((a, b) => (a[0].date < b[0].date ? 1 : -1));
        const open = found.length <= 3;
        box.replaceChildren(...found.map(([c, f]) => el('div', { class: 'hist-item' },
            el('div', { class: 'hist-line' }, commitWords(c), el('span', { class: 'muted' }, shaLink(c), ', ', day(c.date)), versions.length > 1 && versionTag(c.release)),
            fileBlock(f, commitCtx(c), open && f.adds + f.dels <= 300))));
        if (!found.length) { box.replaceChildren(el('div', { class: 'file-note', text: 'No change to this file was found.' })); }
    }).catch(() => {
        box.replaceChildren(el('div', { class: 'file-note', text: 'This file\'s changes could not be loaded.' }));
    });
    return box;
}

// Comments -------------------------------------------------------------------------------------

// The work a conversation led to: anything past waiting, or with commits.
const ledTo = (convo) => convo.items.map((id) => D.itemById.get(id)).filter((i) => i && (i.commits.length || (i.status !== 'open' && i.status !== 'declined')));
// Someone else's thread with no reply of ours seen and nothing made from it.
const needsLook = (convo) => !convo.mine && !convo.replied && !ledTo(convo).length;

function threadCard(convo) {
    const items = convo.items.map((id) => D.itemById.get(id)).filter(Boolean);
    const led = ledTo(convo);
    const where = convo.source === 'github' ? 'GitHub #' + convo.number : 'CurseForge';
    const state = convo.mine ? tag('your post', 'plain')
        : convo.replied ? tag('replied', 'done') : tag('no reply seen', 'ready');
    const work = led.length ? tag(led.length === 1 ? 'led to work' : 'led to ' + led.length + ' pieces of work', 'progress')
        : items.length ? tag('waiting', 'open') : convo.mine ? null : tag('no work', 'open');
    return el('article', { class: 'thread' + (needsLook(convo) ? ' quiet' : '') },
        el('div', { class: 'who' }, el('a', { class: 'tag plain', href: convo.url, text: where }), state, work,
            el('span', { text: 'last ' + day(convo.last) }), isNew(convo.last) ? tag('new', 'ready') : null),
        el('div', { class: 'posts' },
            post({ user: convo.user, name: convo.author, mine: convo.mine, date: convo.date, text: convo.text }, 'first', convo.source, convo, 5),
            convo.posts.map((p) => post(p, p.mine ? 'mine' : '', convo.source, null, 3))),
        items.length ? el('div', { class: 'work-of' }, el('h3', { text: items.length === 1 ? 'The work' : 'The work, ' + items.length + ' pieces' }),
            itemLines(items, (i) => (i.work ? el('span', { class: 'muted small' }, workLine(i)) : null))) : null);
}

function renderComments() {
    const q = S.threadQuery.trim().toLowerCase();
    const bySource = D.comments.filter((t) => S.threadSource === 'all' || t.source === S.threadSource);
    const filters = [
        ['all', 'All', () => true],
        ['look', 'Need a look', needsLook],
        ['work', 'Led to work', (t) => ledTo(t).length > 0],
        ['none', 'No work', (t) => !t.mine && !ledTo(t).length],
    ];
    // Opens on what needs a look, the number the tab shows, when anything does.
    if (!S.threadFilter) { S.threadFilter = D.comments.some(needsLook) ? 'look' : 'all'; }
    const test = (filters.find((f) => f[0] === S.threadFilter) || filters[0])[2];
    const shown = bySource.filter((t) => test(t) && (!q || (t.author + ' ' + (t.title || '') + ' ' + t.text + ' ' + t.posts.map((p) => p.text).join(' ')).toLowerCase().includes(q)));
    const chips = el('div', { class: 'chips', role: 'group', 'aria-label': 'Show' }, filters.map(([id, name, f]) =>
        el('button', { class: 'chip', 'aria-pressed': S.threadFilter === id ? 'true' : 'false', text: name + ' ' + bySource.filter(f).length, onclick: () => { S.threadFilter = id; render(); } })));
    const search = el('input', { class: 'field', id: 'thread-search', type: 'search', placeholder: 'Search comments and issues', 'aria-label': 'Search comments and issues', value: S.threadQuery,
        oninput: (e) => { S.threadQuery = e.target.value; const pos = e.target.selectionStart; render(); const again = document.getElementById('thread-search'); again.focus(); again.setSelectionRange(pos, pos); } });
    const source = el('select', { class: 'field', id: 'thread-source', 'aria-label': 'Where', onchange: (e) => { S.threadSource = e.target.value; render(); } },
        [['all', 'Any source'], ['curseforge', 'CurseForge'], ['github', 'GitHub']].map(([v, t]) => el('option', { value: v, text: t, selected: S.threadSource === v })));
    let cap = 40;
    const list = el('div', { class: 'threads' });
    const draw = () => {
        list.replaceChildren(...shown.slice(0, cap).map(threadCard));
        if (shown.length > cap) { list.append(el('button', { class: 'btn', text: 'Show all ' + shown.length, onclick: () => { cap = Infinity; draw(); } })); }
        if (!shown.length) { list.append(el('div', { class: 'empty', text: S.threadFilter === 'look' ? 'Every thread has a reply or work.' : 'No conversation matches.' })); }
    };
    draw();
    view.replaceChildren(
        chips,
        el('div', { class: 'controls' }, search, source),
        list,
        el('div', { class: 'muted small', text: 'Newest activity first. A thread needs a look when no reply of yours is seen and nothing was made from it. CurseForge\'s feed shows only the first reply of each thread, so one marked "no reply seen" may have a reply on the site.' }));
}

// Shell ----------------------------------------------------------------------------------------

function renderStanding() {
    const b = D.board;
    const latest = D.releaseByVersion.get(b.latest);
    const parts = [];
    // What is unreleased is the Next release tab's number and the Work view's first lines, not here.
    if (latest) { parts.push(el('span', null, el('a', { href: releaseHash(b.latest) }, el('b', { text: b.latest })), ' released ' + day(latest.date + 'T12:00:00-05:00'))); }
    parts.push(el('span', { text: 'as of ' + timeFmt.format(new Date(b.generated)) + ' ET' }));
    const stale = Object.entries(b.sources || {}).filter(([, v]) => v !== 'ok').map(([k]) => k);
    if (stale.length) { parts.push(el('span', null, tag((stale.includes('curseforge') ? 'CurseForge' : 'GitHub') + ' could not be read, showing the last copy', 'ready'))); }
    document.getElementById('standing').replaceChildren(...parts);
    const base = repoUrl();
    document.getElementById('places').replaceChildren(...[
        base && el('a', { href: base, text: 'GitHub' }), base && el('a', { href: base + '/issues', text: 'Issues' }),
        base && el('a', { href: base + '/releases', text: 'Releases' }), b.curseforge && el('a', { href: b.curseforge, text: 'CurseForge' }),
    ].filter(Boolean));
    const counts = {
        work: b.items.filter((i) => ['open', 'progress', 'ready'].includes(i.status)).length,
        ship: b.unreleased,
        comments: D.comments.filter(needsLook).length,
    };
    for (const [id, n] of Object.entries(counts)) {
        const tab = document.getElementById('tab-' + id);
        tab.querySelector('.count')?.remove();
        if (n) { tab.append(el('span', { class: 'count', text: n })); }
    }
}

function render() {
    for (const tab of document.querySelectorAll('.tab')) { tab.setAttribute('aria-selected', tab.dataset.view === S.view ? 'true' : 'false'); }
    ({ work: renderWork, ship: renderShip, releases: renderReleases, comments: renderComments })[S.view]();
}

function route() {
    let name = location.hash.slice(1);
    if (!D.board) { return; }
    if (name.startsWith('item-')) {
        const item = D.itemById.get(name.slice(5));
        if (item) { if (!view.dataset.drawn) { render(); view.dataset.drawn = '1'; } openItem(item); return; }
    }
    closeItem();
    name = ALIAS[name] || name;
    const before = S.view + S.release;
    if (name.startsWith('release-') && D.releaseBySlug.has(name.slice(8))) {
        S.view = 'releases';
        if (S.release !== D.releaseBySlug.get(name.slice(8))) { S.release = D.releaseBySlug.get(name.slice(8)); S.compareFrom = ''; S.pane = 'together'; }
    } else if (VIEWS.includes(name)) {
        if (name !== S.view) { S.pane = 'together'; }
        S.view = name;
    }
    view.dataset.drawn = '1';
    render();
    if (before !== S.view + S.release) { window.scrollTo(0, 0); }
}
for (const tab of document.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => { if (location.hash.slice(1) === tab.dataset.view) { route(); } else { location.hash = tab.dataset.view; } });
}
window.addEventListener('hashchange', route);
if (window.matchMedia('(max-width: 720px)').matches) { app.classList.add('wraplines'); }

Promise.all(['board.json', 'commits.json', 'releases.json', 'comments.json'].map(load)).then(([board, commits, releases, comments]) => {
    Object.assign(D, { board, commits, releases, comments });
    D.commitBySha = new Map(commits.map((c) => [c.sha, c]));
    D.releaseByVersion = new Map(releases.map((r) => [r.version, r]));
    D.releaseBySlug = new Map(releases.map((r) => [slug(r.version), r.version]));
    D.itemById = new Map(board.items.map((i) => [i.id, i]));
    D.convoById = new Map(comments.map((c) => [c.id, c]));
    renderStanding();
    route();
}).catch(() => {
    view.replaceChildren(el('div', { class: 'empty', text: 'The board\'s data could not be loaded. Run tools/board/build.mjs and publish its data files with this page.' }));
});
})();
</script>
